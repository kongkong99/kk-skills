  "events": [

    {"at": 3.5, "type": "status", "text": "深度思考中 · 正在梳理目标与受众"},
    {"at": 7, "type": "tool", "text": "⌕　分析任务需求"},

    {"at": 12, "type": "tool", "text": "⚒　生成营销计划"},

    {"at": 18, "type": "text", "text": "已整理推广动作与每日安排，正在检查内容是否清晰。"},

  ]
}
</script>
<script>
(() => {
  'use strict';
  const config = JSON.parse(document.getElementById('demo-config').textContent);
  const el = id => document.getElementById(id);
  const seconds = Number.isFinite(+config.duration) && +config.duration > 0 ? +config.duration : 24;
  const events = (Array.isArray(config.events) ? config.events : []).map((e, i) => ({...e, _i:i, at:Math.max(0, Number(e.at) || 0)})).sort((a,b) => a.at-b.at || a._i-b._i);
  const list = (id, values) => (Array.isArray(values) ? values : []).forEach(value => { const row = document.createElement('div'); row.className='task'; row.textContent=String(value); el(id).appendChild(row); });
  el('title').textContent = config.title || '模拟任务'; el('sidebarTitle').textContent = config.title || '模拟任务'; el('prompt').textContent = config.prompt || ''; el('modelName').textContent = config.model || 'Hy3'; el('userName').textContent = config.profileName || '示例用户';
  list('pinned', config.pinned); list('tasks', config.tasks); el('seek').max = seconds;
  if (new URLSearchParams(location.search).get('clean') === '1') document.body.classList.add('clean');
  let position = 0, playing = true, prior = performance.now(), lastKey = null, needsScroll = true;
  const format = n => `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`;
  function render() {
    const visible=events.filter(e=>e.at<=position), complete=visible.some(e=>e.type==='complete');
    const artifacts=visible.filter(e=>e.type==='artifact');
    el('elapsed').textContent = complete ? `已完成 ${format(position)}` : `已处理 ${Math.floor(position)}s`;
    el('runningDot').textContent=complete?'':' ◌'; el('stop').classList.toggle('finished',complete);
    el('panel').hidden=!visible.some(e=>e.type==='artifact'||e.type==='panel');
    el('artifactCount').textContent=String(artifacts.length);
    const key=visible.map(e=>e._i).join(',');
    if(key!==lastKey){
      const feed=el('feed'); feed.replaceChildren();
      visible.forEach((e,i)=>{if(e.type==='panel') return; if(e.type==='status' && visible.slice(i+1).some(x=>x.type==='status'||x.type==='complete')) return; const row=document.createElement('div'); row.className='feedrow '+(e.type==='complete'?'result':e.type); row.textContent=(e.type==='artifact'?'▧　':'')+String(e.text||''); feed.appendChild(row);});
      const target=el('artifacts'); target.replaceChildren(); artifacts.forEach(e=>{let row=document.createElement('div');row.className='panel-file';row.textContent='▧　'+String(e.text||'演示产物');target.appendChild(row)});
      lastKey=key; needsScroll=true;
    }
    if(needsScroll){el('body').scrollTop=el('body').scrollHeight;needsScroll=false;}
    document.documentElement.style.setProperty('--spin', `${position * 276.923}deg`);
    el('seek').value=position; el('clock').textContent=`${format(position)} / ${format(seconds)}`;el('toggle').textContent=playing?'暂停':'播放';
  }
  function tick(now){if(playing){position=Math.min(seconds,position+(now-prior)/1000);if(position>=seconds)playing=false;}prior=now;render();requestAnimationFrame(tick);}
  el('toggle').addEventListener('click',()=>{if(position>=seconds)position=0;playing=!playing;prior=performance.now();render()});
  el('restart').addEventListener('click',()=>{position=0;playing=true;prior=performance.now();lastKey=null;render()});
  el('seek').addEventListener('input',e=>{position=Number(e.target.value);prior=performance.now();lastKey=null;render()});
  window.simulationDuration = seconds;
  window.SIMULATION_DURATION = seconds;
  window.setSimulationTime = value => { playing=false; document.body.classList.add('clean'); document.documentElement.classList.add('frame-capture'); position=Math.max(0,Math.min(seconds,Number(value)||0)); prior=performance.now(); lastKey=null; render(); };
  window.WorkBuddyDemo = { seek(secondsValue){position=Math.max(0,Math.min(seconds,Number(secondsValue)||0));prior=performance.now();lastKey=null;render()}, play(){playing=true;prior=performance.now()}, pause(){playing=false;render()}, get time(){return position}, get duration(){return seconds} };
  render(); requestAnimationFrame(tick);
})();
</script>
